<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FilePond Slider View Demo</title>
        <link href="./dist/filepond.css" rel="stylesheet" />
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                margin: 2rem;
                background: #f9fafb;
                color: #111827;
            }

            h1 {
                font-size: 1.25rem;
                margin: 0 0 0.5rem;
            }

            p {
                margin: 0 0 1.5rem;
                color: #4b5563;
                font-size: 0.875rem;
            }

            /* Slider container needs an explicit height because items use height:100% */
            .slider-container {
                height: 220px;
                width: 100%;
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 0.5rem;
                padding: 0.5rem;
            }

            /* ---- Slider-view styles (mirrors watchcrunch's filepond.css) ---- */

            .filepond--root.filepond--slider {
                margin-bottom: 0;
                width: 100%;
                height: 100%;
            }

            .filepond--root.filepond--slider .filepond--file .filepond--file-info,
            .filepond--root.filepond--slider .filepond--file .filepond--file-status {
                display: none;
            }

            .filepond--root.filepond--slider .filepond--file .filepond--file-action-button {
                background: rgba(0, 0, 0, 0.5);
            }

            .filepond--root.filepond--slider .filepond--image-preview-overlay {
                display: none;
            }

            .filepond--root.filepond--slider .filepond--item {
                margin-top: 0;
                margin-bottom: 0;
                height: 100%;
                width: 200px;
            }

            .filepond--root.filepond--slider .filepond--panel-root {
                border: 0;
                background-color: transparent;
                background-image: none;
            }

            .filepond--root.filepond--slider .filepond--list.filepond--list {
                inset: 0;
                height: 100%;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 0.25rem;
            }

            /* Suppress scrollbar flash while items animate in/out */
            .filepond--root.filepond--slider
                .filepond--list.filepond--list.filepond--list--animating {
                overflow-x: hidden;
            }

            .filepond--root.filepond--slider .filepond--list-scroller {
                inset: 0;
                margin: 0 -0.25rem;
            }

            .filepond--root.filepond--slider .filepond--drop-label {
                display: flex;
                height: 100%;
                min-height: 0;
                width: 100%;
                align-items: flex-start;
                padding: 0 0.25rem;
            }

            .filepond--root.filepond--slider .filepond--drop-label .filepond--drop-label-inner {
                display: flex;
                min-height: 11rem;
                width: 100%;
                cursor: pointer;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 0.5rem;
                background-color: #f3f4f6;
                color: #6b7280;
                font-size: 0.875rem;
            }
        </style>
    </head>
    <body>
        <h1>FilePond — Slider View</h1>
        <p>Horizontal carousel layout. Add/remove items to see the layout transition.</p>

        <div class="slider-container">
            <input type="file" multiple />
        </div>

        <script src="./dist/filepond.js"></script>
        <script>
            const inputElement = document.querySelector('input[type="file"]');

            const pond = FilePond.create(inputElement, {
                allowMultiple: true,
                storeAsFile: true,
                sliderView: true,
                maxLabelWidth: 200,
                labelIdle: 'Drop or click to add files',
            });

            window.pond = pond;
        </script>
    </body>
</html>
